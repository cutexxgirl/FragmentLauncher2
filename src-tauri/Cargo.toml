[package]
name = "fragment-launcher"
version = "1.0.0"
description = "Launcher for the Fragment Minecraft singleplayer modpack."
authors = ["cutexxgirl"]
license = ""
repository = "https://github.com/cutexxgirl/FragmentLauncher2"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fragment_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
fs2 = "0.4.3"
semver = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem"] }
