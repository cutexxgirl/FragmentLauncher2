[package]
name = "fragment-launcher"
version = "1.0.0"
description = "Launcher for the Fragment Minecraft singleplayer modpack."
authors = ["cutexxgirl"]
license = ""
repository = "https://github.com/cutexxgirl/FragmentLauncher2"
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fragment_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tough = { version = "=0.24.0", default-features = false }
fs2 = "0.4.3"
jiff = "0.2"
semver = "1"
thiserror = "2"
unicode-normalization = "0.1.25"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
